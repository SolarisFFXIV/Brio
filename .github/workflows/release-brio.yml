name: Release Brio - Solaris Fork

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to create
        required: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Restore Dependencies
      run: dotnet restore Brio.slnx

    - name: Get version
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Build Brio
      run: dotnet build Brio.slnx --no-restore /p:Configuration=Release /p:Version=${{ steps.version.outputs.VERSION }}

    - name: Zip Release
      uses: TheDoctor0/zip-release@0.6.0
      with:
        filename: '../../../../Brio.zip'
        directory: './Brio/bin/x64/Release/'
        exclusions: 'Brio Brio/*'
        
    - name: Upload Release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        artifacts: "./Brio.zip"
        name: Brio - Solaris Fork v${{ steps.version.outputs.VERSION }}
        tag: v${{ steps.version.outputs.VERSION }}
        draft: false
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update repo.json
      run: |
        git config --global user.name "Actions User"
        git config --global user.email "actions@github.com"
        git fetch origin solaris && git checkout solaris
        $ver = '${{ steps.version.outputs.VERSION }}'
        $repoPath = './repo.json'
        $content = Get-Content -Path $repoPath -Raw | ConvertFrom-Json
        $content[0].AssemblyVersion = $ver
        $content[0].TestingAssemblyVersion = $ver
        $content[0].DownloadLinkInstall = "https://github.com/SolarisFFXIV/Brio/releases/download/v$ver/Brio.zip"
        $content[0].DownloadLinkTesting = "https://github.com/SolarisFFXIV/Brio/releases/download/v$ver/Brio.zip"
        $content[0].DownloadLinkUpdate = "https://github.com/SolarisFFXIV/Brio/releases/download/v$ver/Brio.zip"
        $content | ConvertTo-Json -Depth 10 | Set-Content -Path $repoPath
        git add repo.json
        git commit -m "[CI] Update repo.json for v$ver" || true
        git push origin solaris || true
